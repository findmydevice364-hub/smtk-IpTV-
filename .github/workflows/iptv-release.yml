name: IPTV Mega Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp

      - name: Run IPTV collector
        run: |
          python IpTV_mega.py \
            --passes 1 \
            --output output_iptv_data \
            --no-epg

      - name: Archive output folder
        run: |
          if [ -d "output_iptv_data" ]; then
            zip -r output_iptv_data.zip output_iptv_data
          else
            echo "output_iptv_data not found"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: iptv-mega-${{ github.run_number }}
          name: IPTV Mega Release ${{ github.run_number }}
          files: output_iptv_data.zip
          draft: false
          prerelease: false